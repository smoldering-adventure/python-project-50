##########################################################################
#                    DO NOT DELETE OR EDIT THIS FILE                     #
#     This file is automatically generated and used to run tests         #
##########################################################################

name: hexlet-check

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hexlet project check
        uses: hexlet/project-action@release
        with:
          hexlet-id: ${{ secrets.HEXLET_ID }}

      - name: Install dependencies
        run: |
          pip install uv
          make install

      - name: Run setup
        run: make setup

      - name: Run tests
        run: |
          make test
          make test-coverage

      - name: Run linter
        run: make lint

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization.key=smoldering-adventure
            -Dsonar.projectKey=smoldering-adventure_python-project-50
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=tests/**,**/test_*.py,**/conftest.py